name: iOS IPA

# Manual trigger: Actions tab -> "iOS IPA" -> Run workflow.
# Produces an UNSIGNED SolunaReceiver.ipa (re-sign with your own cert, or sideload
# via AltStore/Sideloadly). App Store / TestFlight builds still use `fastlane beta`
# on a Mac with the App Store Connect API key.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install cmake

      - name: Build soluna_core for iOS (arm64)
        run: |
          mkdir -p build-ios && cd build-ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          xcodebuild -project soluna.xcodeproj -scheme soluna_core \
            -configuration Release -sdk iphoneos build \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive SolunaReceiver (unsigned)
        run: |
          cd apps/ios
          xcodebuild archive \
            -project Soluna.xcodeproj \
            -scheme Soluna \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/SolunaReceiver.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP"/SolunaReceiver.xcarchive/Products/Applications/*.app out/Payload/
          cd out && zip -qr SolunaReceiver-unsigned.ipa Payload

      - uses: actions/upload-artifact@v6
        with:
          name: SolunaReceiver-unsigned-ipa
          path: out/SolunaReceiver-unsigned.ipa
