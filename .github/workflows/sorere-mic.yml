name: Sorere Mic

on:
  push:
    branches:
      - master
      - feature/iphone-mic-mvp
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac-host:
    name: Mac host (arm64)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build-mac -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSOLUNA_BUILD_TESTS=OFF

      - name: Build solunad
        run: cmake --build build-mac --target solunad --parallel

      - name: Smoke test
        run: |
          ./build-mac/solunad --help >/dev/null
          bash -n tools/sorere/SorereHost.command
          bash -n tools/sorere/InstallSorereHost.command
          bash -n tools/sorere/UninstallSorereHost.command

      - name: Package host
        run: |
          rm -rf dist/SorereHost
          mkdir -p dist/SorereHost
          cp build-mac/solunad dist/SorereHost/
          cp tools/sorere/*.command dist/SorereHost/
          cp LICENSE dist/SorereHost/
          chmod +x dist/SorereHost/solunad dist/SorereHost/*.command
          /usr/bin/ditto -c -k --keepParent dist/SorereHost dist/SorereHost-macos-arm64.zip

      - name: Upload Mac host
        uses: actions/upload-artifact@v6
        with:
          name: SorereHost-macos-arm64
          path: dist/SorereHost-macos-arm64.zip
          if-no-files-found: error

  build-ios:
    name: iPhone app (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure iOS core
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DSOLUNA_BUILD_TESTS=OFF

      - name: Build iOS core
        run: |
          CORE_PROJ="$(find build-ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$CORE_PROJ"
          echo "Core project: $CORE_PROJ"
          xcodebuild \
            -project "$CORE_PROJ" \
            -scheme soluna_core \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Sorere Mic app
        run: |
          rm -rf build-iphone-app
          mkdir -p build-iphone-app
          xcodebuild \
            -project apps/ios/Soluna.xcodeproj \
            -scheme Soluna \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build-iphone-app" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$(find build-iphone-app -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          echo "App: $APP"
          rm -rf dist/Payload
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/SorereMic.app
          (
            cd dist
            /usr/bin/zip -qry SorereMic-unsigned.ipa Payload
          )
          /usr/bin/codesign -dvv dist/Payload/SorereMic.app 2>&1 || true
          /usr/bin/unzip -l dist/SorereMic-unsigned.ipa | head -30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: SorereMic-unsigned-ipa
          path: dist/SorereMic-unsigned.ipa
          if-no-files-found: error
