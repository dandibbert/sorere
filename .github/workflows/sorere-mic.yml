name: Sorere Mic

on:
  push:
    branches:
      - master
      - feature/iphone-mic-mvp
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sorere-mic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-host:
    name: Mac host (arm64)
    # Cross-compile arm64 on the x64 pool so this tiny host does not wait behind
    # the heavier iOS/macOS-26 jobs.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build minimal Sorere host
        run: |
          mkdir -p build-mac
          clang++ \
            -std=c++17 \
            -O2 \
            -arch arm64 \
            -mmacosx-version-min=13.0 \
            -x objective-c++ \
            tools/sorere/SorereHost.mm \
            -framework CoreAudio \
            -framework CoreFoundation \
            -o build-mac/sorere-host

      - name: Build native Sorere app
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc             -parse-as-library             -O             -target arm64-apple-macos13.0             -sdk "$SDK"             tools/sorere/SorereMacApp.swift             -framework SwiftUI             -framework AppKit             -framework ServiceManagement             -o build-mac/Sorere

      - name: Smoke test
        run: |
          test -x build-mac/sorere-host
          test -x build-mac/Sorere
          file build-mac/sorere-host
          file build-mac/Sorere
          bash -n tools/sorere/SorereHost.command
          bash -n tools/sorere/TestBlackHole.command
          bash -n tools/sorere/InstallSorereHost.command
          bash -n tools/sorere/UninstallSorereHost.command

      - name: Package native app
        run: |
          rm -rf dist/Sorere.app dist/SorereHost
          mkdir -p dist/Sorere.app/Contents/MacOS
          mkdir -p dist/Sorere.app/Contents/Resources
          cp build-mac/Sorere dist/Sorere.app/Contents/MacOS/Sorere
          cp build-mac/sorere-host dist/Sorere.app/Contents/Resources/sorere-host
          cp tools/sorere/SorereMacInfo.plist dist/Sorere.app/Contents/Info.plist

          # Reuse the iOS Sorere artwork and generate a real macOS .icns bundle.
          ICON_SOURCE="apps/ios/SolunaReceiver/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -z 16 16 "$ICON_SOURCE" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 "$ICON_SOURCE" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$ICON_SOURCE" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_512x512.png" >/dev/null
          cp "$ICON_SOURCE" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o dist/Sorere.app/Contents/Resources/AppIcon.icns

          chmod +x dist/Sorere.app/Contents/MacOS/Sorere
          chmod +x dist/Sorere.app/Contents/Resources/sorere-host

          # Ad-hoc signing keeps the two embedded executables internally consistent.
          codesign --force --sign - dist/Sorere.app/Contents/Resources/sorere-host
          codesign --force --deep --sign - dist/Sorere.app
          codesign --verify --deep --strict dist/Sorere.app

          test -f dist/Sorere.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" dist/Sorere.app/Contents/Info.plist | grep -q AppIcon

          mkdir -p dist/SorereHost
          cp -R dist/Sorere.app dist/SorereHost/
          cp tools/sorere/*.command dist/SorereHost/
          cp LICENSE dist/SorereHost/
          chmod +x dist/SorereHost/*.command

          /usr/bin/ditto -c -k --keepParent dist/Sorere.app dist/Sorere-macos-arm64.zip
          /usr/bin/ditto -c -k --keepParent dist/SorereHost dist/SorereHost-macos-arm64.zip

      - name: Upload Mac app
        uses: actions/upload-artifact@v6
        with:
          name: Sorere-macos-arm64
          path: |
            dist/Sorere-macos-arm64.zip
            dist/SorereHost-macos-arm64.zip
          if-no-files-found: error

  build-ios:
    name: iPhone app (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure iOS core
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DSOLUNA_BUILD_TESTS=OFF

      - name: Build iOS core
        run: |
          CORE_PROJ="$(find build-ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$CORE_PROJ"
          echo "Core project: $CORE_PROJ"
          xcodebuild \
            -project "$CORE_PROJ" \
            -scheme soluna_core \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Sorere Mic app
        run: |
          rm -rf build-iphone-app
          mkdir -p build-iphone-app
          xcodebuild \
            -project apps/ios/Soluna.xcodeproj \
            -scheme Soluna \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build-iphone-app" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$(find build-iphone-app -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          echo "App: $APP"
          rm -rf dist/Payload
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/SorereMic.app
          (
            cd dist
            /usr/bin/zip -qry SorereMic-unsigned.ipa Payload
          )
          /usr/bin/codesign -dvv dist/Payload/SorereMic.app 2>&1 || true
          /usr/bin/unzip -l dist/SorereMic-unsigned.ipa | head -30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: SorereMic-unsigned-ipa
          path: |
            dist/SorereMic-unsigned.ipa
            LICENSE
          if-no-files-found: error
